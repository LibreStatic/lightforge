<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background with a subtle gradient -->
        <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E8EEF6" />
        </linearGradient>

        <!-- Material Design shadow (two layers for extra realism) -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#001A33" flood-opacity="0.1" />
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001A33" flood-opacity="0.12" />
        </filter>

        <!-- Petal template (rotated diamond with rounded outer tips) -->
        <path id="petal" d="M 0,0
                           L 92,-92 Q 106,-106 92,-120
                           L 14,-198 Q 0,-212 -14,-198
                           L -92,-120 Q -106,-106 -92,-92 Z" />

        <!-- Clip mask that splits the petals in half (3D fold/light effect) -->
        <clipPath id="right-half">
            <rect x="0" y="-250" width="150" height="300" />
        </clipPath>
    </defs>

    <!-- Adaptive icon base (rounded square background) -->
    <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

    <!-- Main pinwheel/flower group -->
    <g transform="translate(256, 256) scale(0.78)" filter="url(#shadow)">

        <!-- Top petal (red) -->
        <g transform="rotate(0)">
            <use href="#petal" fill="#EA4335" /> <!-- Left half (light) -->
            <use href="#petal" fill="#D93025" clip-path="url(#right-half)" /> <!-- Right half (shadow) -->
        </g>

        <!-- Right petal (yellow) -->
        <g transform="rotate(90)">
            <use href="#petal" fill="#FBBC05" /> <!-- Top half (light) -->
            <use href="#petal" fill="#F29900" clip-path="url(#right-half)" /> <!-- Bottom half (shadow) -->
        </g>

        <!-- Bottom petal (green) -->
        <g transform="rotate(180)">
            <use href="#petal" fill="#1E8E3E" /> <!-- Visual right half (shadow) -->
            <use href="#petal" fill="#34A853" clip-path="url(#right-half)" /> <!-- Visual left half (light) -->
        </g>

        <!-- Left petal (blue) -->
        <g transform="rotate(270)">
            <use href="#petal" fill="#1A73E8" /> <!-- Visual bottom half (shadow) -->
            <use href="#petal" fill="#4285F4" clip-path="url(#right-half)" /> <!-- Visual top half (light) -->
        </g>

    </g>
</svg>
