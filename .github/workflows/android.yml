name: Android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - run: ./gradlew :app:assembleOfflineDebug :app:assembleOfflineRelease :app:compileOfflineDebugAndroidTestKotlin test lint
      - run: python tools/verify_offline_release.py --expect-all-files

  build-without-all-files:
    # ADR-046: the flavor-free build with the advanced storage mode compiled out must stay green
    # and must not declare MANAGE_EXTERNAL_STORAGE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - run: ./gradlew -Plightforge.allFilesAccess=false :app:assembleOfflineRelease test
      - run: python tools/verify_offline_release.py --no-all-files
