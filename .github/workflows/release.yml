name: Release

# Builds signed AAB/APK on every push to main and publishes a GitHub Release
# when the versionName/versionCode pair has not been released yet.
# Uploading the AAB to Google Play stays manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*versionCode = .*?: \([0-9]\+\).*/\1/p' app/build.gradle.kts | head -1)
          tag="v${name}+${code}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIGHTFORGE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::LIGHTFORGE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "LIGHTFORGE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build signed artifacts
        env:
          LIGHTFORGE_KEYSTORE_PASSWORD: ${{ secrets.LIGHTFORGE_KEYSTORE_PASSWORD }}
          LIGHTFORGE_KEY_ALIAS: ${{ secrets.LIGHTFORGE_KEY_ALIAS }}
          LIGHTFORGE_KEY_PASSWORD: ${{ secrets.LIGHTFORGE_KEY_PASSWORD }}
        run: ./gradlew test lint :app:bundleOfflineRelease :app:assembleOfflineRelease

      - name: Verify offline release
        run: python tools/verify_offline_release.py

      - name: Collect artifacts
        run: |
          mkdir -p dist
          base="lightforge-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          cp app/build/outputs/bundle/offlineRelease/*.aab "dist/$base.aab"
          cp app/build/outputs/apk/offline/release/*.apk "dist/$base.apk"
          cp app/build/outputs/mapping/offlineRelease/mapping.txt "dist/$base-mapping.txt"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: lightforge-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/

      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Lightforge ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --generate-notes \
            --prerelease
