<!--
  Deterministic promo mock: nothing animates on its own. render(t) positions every
  element for time t (seconds), so render.mjs can capture exact frames.
  Open with ?play to preview in real time.
  App colors follow the Material 3 dark scheme used by LightforgeTheme, always as
  matching container/on-container pairs.

<style>

<script>
const DURATION = 57;
const PORTRAIT = location.search.includes('portrait');
if (PORTRAIT) document.body.classList.add('portrait');
const SHIFT = 24.1; // outro logo reuses the intro-relative timings, shifted
const W = 400, H = 866;
const $ = id => document.getElementById(id);
const el = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const css = (e, s) => { for (const k in s) e.style[k] = s[k]; };
const rng = seed => () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

const ICON = {
  search: 'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  lock: 'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z',

  check: 'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
  photo: 'M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z',
  collections: 'M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4 2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z',
  place: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z',
  collage: 'M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z',
  gif: 'M11.5 9H13v6h-1.5zM9 9H6c-.6 0-1 .5-1 1v4c0 .5.4 1 1 1h3c.6 0 1-.5 1-1v-2H8.5v1.5h-2v-3H10V10c0-.5-.4-1-1-1zm10 1.5V9h-4.5v6H16v-2h2v-1.5h-2v-1z',
  pdf: 'M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z',

};
const ic = (n, size = 24) => `<svg class="ic" viewBox="0 0 24 24" style="width:${size}px;height:${size}px"><path d="${ICON[n]}"/></svg>`;

/* ---------- procedural "photos" (no real captures) ---------- */
const PAL = [
  ['#ffb36b', '#ff5f7e', '#40286e', 'sun'], ['#8fd8ff', '#2a78c2', '#ecd6a3', 'sea'],
  ['#c6ec7a', '#3f8f4a', '#1f4a2a', 'hill'], ['#2a2356', '#7a47b0', '#ffe3a0', 'city'],
  ['#ffd9a8', '#f08a5d', '#5b3563', 'peak'], ['#bfe8de', '#5aa89a', '#27525b', 'peak'],
  ['#ffe29a', '#ff9f68', '#a8466a', 'sun'], ['#a9c8ff', '#6f7fe0', '#2e2f6e', 'peak'],
  ['#ffc9d6', '#e57fa4', '#6d3a73', 'hill'], ['#9fe7ff', '#39a0d6', '#f4dfae', 'sea'],
];
function photo(i, forceType) {
  const r = rng(i * 7919 + 101);
  let k = PAL[Math.floor(r() * PAL.length)];
  if (forceType) k = PAL.filter(p => p[3] === forceType)[i % PAL.filter(p => p[3] === forceType).length];
  const [a, b, c, type] = k; const x = 22 + r() * 56, y = 18 + r() * 30; const L = [];
  if (type === 'sun') L.push(`radial-gradient(circle at ${x}% ${y + 18}%,#fff6cf 0 9%,rgba(255,240,200,.35) 15%,transparent 32%)`, `linear-gradient(180deg,transparent 64%,${c} 64%)`);
  if (type === 'sea') L.push(`radial-gradient(circle at ${x}% ${y}%,#fffbe8 0 7%,transparent 8%)`, `linear-gradient(180deg,transparent 52%,${b} 52% 74%,${c} 74%)`);
  if (type === 'hill') L.push(`radial-gradient(ellipse 95% 42% at ${x}% 102%,${c} 0 60%,transparent 61%)`, `radial-gradient(ellipse 85% 42% at ${100 - x}% 90%,${b} 0 60%,transparent 61%)`);
  if (type === 'city') L.push(`radial-gradient(circle at ${x}% ${y}%,${c} 0 6%,transparent 7%)`, `linear-gradient(90deg,#15112e 0 18%,transparent 18% 22%,#1b1638 22% 46%,transparent 46% 52%,#120e28 52% 70%,transparent 70% 76%,#1a1535 76%)`);
  if (type === 'peak') L.push(`conic-gradient(from 150deg at ${x}% ${y + 12}%,${c} 0 60deg,transparent 60deg)`, `conic-gradient(from 140deg at ${100 - x * .6}% ${y + 30}%,${b} 0 80deg,transparent 80deg)`);
  L.push(`linear-gradient(${150 + r() * 60}deg,${a},${b})`);
  let bg = L.join(',');
  if (type === 'city') bg = [L[0], L[2]].join(',');
  return { bg, city: type === 'city' };
}
function tile(parent, i, type) {
  const t = el('div', 'tile', null, parent); const ph = el('div', 'ph', null, t); const p = photo(i, type);
  ph.style.background = p.bg;
  if (p.city) { const s = el('div', 'ph', null, t); s.style.background = 'linear-gradient(90deg,#15112e 0 18%,transparent 18% 22%,#1b1638 22% 46%,transparent 46% 52%,#120e28 52% 70%,transparent 70% 76%,#1a1535 76%)'; s.style.clipPath = 'polygon(0 55%,18% 55%,18% 70%,22% 70%,22% 40%,46% 40%,46% 62%,52% 62%,52% 48%,70% 48%,70% 66%,76% 66%,76% 52%,100% 52%,100% 100%,0 100%)'; }
  return t;
}

    stripTiles.forEach((e, i) => {
      let slot = i; if (i === 4) slot = lerp(4, 2, sw); else if (i === 2 || i === 3) slot = i + sw;
      const lift = i === 4 ? Math.sin(sw * Math.PI) * -18 : 0;
      const k = back(P(t, 32.4 + i * .07, 32.8 + i * .07));
      css(e, { left: 20 + slot * 62 + 'px', transform: `translateY(${lift + (1 - k) * 30}px) scale(${i === 4 && sw > 0 && sw < 1 ? 1.12 : 1})`, opacity: clamp(k), boxShadow: order[cur] === i ? '0 0 0 3px #D0BCFF' : 'none', zIndex: i === 4 ? 2 : 1 });
    });
    if (t > 33.2 && t < 33.55) touch(0, 20 + 2 * 97 + 40, 618, 1, 1 - P(t, 33.4, 33.55));
    if (t > 34.1 && t < 35.0) touch(0, 20 + lerp(4, 2, sw) * 62 + 28, 510 + Math.sin(sw * Math.PI) * -18, 1, Math.min(P(t, 34.1, 34.25), 1 - P(t, 34.85, 35)));
    if (t > 35.4 && t < 35.75) touch(0, 200, 726, 1, 1 - P(t, 35.6, 35.75));
    gifBtn.style.transform = `scale(${1 - .06 * Math.sin(P(t, 35.5, 35.8) * Math.PI)})`;
    css(gifBar, { opacity: t > 35.7 && t < 36.8 ? 1 : 0 }); gifBar.firstChild.style.width = 100 * eio(P(t, 35.7, 36.5)) + '%';
    const gsk = eo5(P(t, 36.5, 36.9)); css(gifSnack, { opacity: gsk, transform: `translateY(${(1 - gsk) * 90}px)` });
  }

  // ---- PDF Studio 37.4–44.0
  const spd = screenAt(t, 37.4, 44.4, .4); applyScreen(sPdf, spd);
  if (spd.vis) {
    const land = eio(P(t, 40.2, 40.8));
    const pw2 = lerp(230, 330, land), ph2 = lerp(325, 233, land);
    css(page, { left: (400 - pw2) / 2 + 'px', top: (372 - ph2) / 2 + 'px', width: pw2 + 'px', height: ph2 + 'px' });
    orientChip.textContent = land > .5 ? 'Landscape' : 'Portrait'; orientChip.className = 'chip' + (land > .5 ? '' : ' out');
    const cols = lerp(1, 2, eio(P(t, 38.4, 39.0))) + eio(P(t, 39.3, 39.9));
    const colsInt = Math.round(cols);
    const mar = lerp(12, 6, eio(P(t, 41.0, 41.6)));
    $('colV').textContent = colsInt; $('marV').textContent = Math.round(mar) + ' mm';
    const cp = (cols - 1) / 3; colSl.firstChild.style.width = cp * 100 + '%'; colSl.lastChild.style.left = cp * 100 + '%';
    const mp = mar / 20; marSl.firstChild.style.width = mp * 100 + '%'; marSl.lastChild.style.left = mp * 100 + '%';
    const m = mar * 1.4, gap = 6;
    pdfImgs.forEach((e, i) => {
      const lay = c => { const cw = (pw2 - 2 * m - (c - 1) * gap) / c; const rows = Math.ceil(6 / c); const rh = (ph2 - 2 * m - (rows - 1) * gap) / rows; return { x: m + (i % c) * (cw + gap), y: m + Math.floor(i / c) * (rh + gap), w: cw, h: rh }; };
      const c1 = Math.floor(cols), c2 = Math.min(3, c1 + 1), f = cols - c1; const a = lay(c1), b = lay(c2);
      const k = back(P(t, 37.8 + i * .08, 38.2 + i * .08));
      css(e, { left: lerp(a.x, b.x, f) + 'px', top: lerp(a.y, b.y, f) + 'px', width: lerp(a.w, b.w, f) + 'px', height: lerp(a.h, b.h, f) + 'px', borderRadius: '3px', opacity: clamp(k), transform: `scale(${clamp(k, 0, 1.1)})` });
    });
    const snap = t > 41.9; snapGrid.style.opacity = snap ? eo(P(t, 41.9, 42.2)) : 0;
    css(snapSw, { background: snap ? '#D0BCFF' : '#36343B', boxShadow: snap ? 'none' : '0 0 0 2px #938F99 inset' });
    css(snapSw.firstChild, { left: snap ? '26px' : '6px', background: snap ? '#381E72' : '#938F99' });
    pthumbs.forEach((d, i) => { const k = back(P(t, 38.0 + i * .1, 38.4 + i * .1)); css(d, { opacity: clamp(k), transform: `scale(${k})` }); });
    const taps = [[38.4, lerp(20, 380, 1 / 3) , 574, 39.9, lerp(20, 380, 1)], [40.2, 330, 506], [41.0, lerp(20, 380, .6), 628, 41.6, lerp(20, 380, .3)], [41.9, 350, 664], [42.6, 318, 732]];
    taps.forEach(([tt, x, y, t2, x2]) => {
      if (t2) { if (t > tt - .2 && t < t2 + .15) touch(0, lerp(x, x2, eio(P(t, tt, t2))), y, 1, Math.min(P(t, tt - .2, tt), 1 - P(t, t2, t2 + .15))); }
      else if (t > tt - .2 && t < tt + .15) touch(0, x, y, 1 - .15 * Math.sin(P(t, tt - .2, tt + .15) * Math.PI), 1 - P(t, tt, tt + .15));
    });
    pdfBtn.style.transform = `scale(${1 - .06 * Math.sin(P(t, 42.5, 42.8) * Math.PI)})`;
    const psk = eo5(P(t, 42.8, 43.2)); css(pdfSnack, { opacity: psk, transform: `translateY(${(1 - psk) * 90}px)` });
    $('pdfSnackT').textContent = t < 43.4 ? 'Export queued. You can keep editing.' : 'PDF ready';
    $('pdfSnackB').textContent = t < 43.4 ? '' : 'Save PDF';
  }

  // ---- licenses 44.6–52.3 (canvas)
  const licVis = t > 44.6 && t < 52.4; $('lic').style.display = licVis ? 'block' : 'none';
  if (licVis) {
    const out = eio(P(t, 51.9, 52.4));
    const hk = eo5(P(t, 44.8, 45.5)); css(licHero, { opacity: hk * (1 - out), transform: `translateY(${(1 - hk) * 60}px) scale(${lerp(.9, 1, hk)})` });
    licCards.forEach((c, i) => { if (!c) return; const k = back(P(t, 45.6 + i * .32, 46.2 + i * .32)); css(c, { opacity: clamp(k) * (1 - out), transform: `translateY(${(1 - k) * 50 - out * 20}px) scale(${.7 + .3 * k}) rotate(${(1 - clamp(k)) * (i % 2 ? 6 : -6)}deg)` }); });
    const nk = eo(P(t, 45.6, 49.0)); $('licN').textContent = Math.round(225 * nk) + '+';
    css(licFoot, { opacity: eo(P(t, 45.6, 46.0)) * (1 - out) });
  }

  // ---- nav (shared across screens)
  const navHide = Math.max(eio(P(t, 18.5, 18.9)) * (1 - eio(P(t, 23.0, 23.4))), eio(P(t, 24.8, 25.2)));
  css(nav, { display: t > 3 && t < 28.2 ? 'flex' : 'none', transform: `translateY(${navHide * 100}px)`, opacity: sg.vis ? Math.max(sg.op, ss.op, sp.op, sc.op) : Math.max(ss.op, sp.op, sc.op, 0) });
  const pos = t < 9.2 ? 0 : t < 14.2 ? lerp(0, 2, eio(P(t, 9.2, 9.6))) : t < 23 ? lerp(2, 1, eio(P(t, 14.2, 14.6))) : lerp(1, 0, eio(P(t, 23.2, 23.6)));
  navInd.style.left = navX(pos) + 'px';
  const pulse = 1 + .12 * Math.sin(P(t, 9.2, 9.6) * Math.PI) + .12 * Math.sin(P(t, 14.2, 14.6) * Math.PI) + .12 * Math.sin(P(t, 23.2, 23.6) * Math.PI);
  navInd.style.transform = `scaleX(${pulse})`;
  navIts.forEach((n, i) => { const on = Math.abs(pos - i) < .5; n.style.color = on ? '#E6E0E9' : '#CAC4D0'; n.firstChild.style.color = on ? '#E8DEF8' : '#CAC4D0'; });
}

window.render = render; window.DURATION = DURATION;
if (location.search.includes('play')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
else render(+(new URLSearchParams(location.search).get('t') || 0));
</script>
